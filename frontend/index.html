<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Demo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>DevOps Demo App</h1>
    <p class="subtitle">Frontend hosted on <strong>S3</strong> · Backend running on <strong>EC2</strong></p>

    <button id="callApiBtn">Call API</button>

    <div id="result" class="result hidden">
      <p><span class="label">Message:</span> <span id="message"></span></p>
      <p><span class="label">Timestamp:</span> <span id="timestamp"></span></p>
    </div>

    <div id="error" class="error hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
