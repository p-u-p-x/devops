<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Demo App</title>
  <style>
/* ===== Reset & Base ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 2.5rem 3rem;
  text-align: center;
  max-width: 480px;
  width: 90%;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

h1 {
  font-size: 1.8rem;
  font-weight: 700;
  color: #f8fafc;
  margin-bottom: 0.5rem;
}

.subtitle {
  font-size: 0.9rem;
  color: #94a3b8;
  margin-bottom: 2rem;
}

.subtitle strong {
  color: #38bdf8;
}

button {
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.75rem 2rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.1s ease;
}

button:hover {
  background: #1d4ed8;
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  background: #475569;
  cursor: not-allowed;
  transform: none;
}

.result {
  margin-top: 1.75rem;
  background: #0f172a;
  border: 1px solid #22c55e44;
  border-radius: 8px;
  padding: 1.25rem 1.5rem;
  text-align: left;
}

.result p {
  margin-bottom: 0.5rem;
  font-size: 0.95rem;
  line-height: 1.6;
}

.result p:last-child {
  margin-bottom: 0;
}

.label {
  font-weight: 600;
  color: #22c55e;
  margin-right: 0.4rem;
}

.error {
  margin-top: 1.75rem;
  background: #1e0a0a;
  border: 1px solid #ef444466;
  border-radius: 8px;
  padding: 1rem 1.5rem;
  color: #fca5a5;
  font-size: 0.9rem;
}

.hidden {
  display: none;
}
  </style>
</head>
<body>
  <div class="container">
    <h1>DevOps Demo App</h1>
    <p class="subtitle">Frontend hosted on <strong>S3</strong> · Backend running on <strong>EC2</strong></p>

    <button id="callApiBtn">Call API</button>

    <div id="result" class="result hidden">
      <p><span class="label">Message:</span> <span id="message"></span></p>
      <p><span class="label">Timestamp:</span> <span id="timestamp"></span></p>
    </div>

    <div id="error" class="error hidden"></div>
  </div>

  <script>
const BACKEND_URL = 'http://13.60.227.234:3000';

const btn       = document.getElementById('callApiBtn');
const resultBox = document.getElementById('result');
const errorBox  = document.getElementById('error');
const msgEl     = document.getElementById('message');
const tsEl      = document.getElementById('timestamp');

btn.addEventListener('click', async () => {
  resultBox.classList.add('hidden');
  errorBox.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Calling…';

  try {
    const response = await fetch(`${BACKEND_URL}/api/message`);

    if (!response.ok) {
      throw new Error(`Server responded with status ${response.status}`);
    }

    const data = await response.json();

    msgEl.textContent = data.message;
    tsEl.textContent  = new Date(data.timestamp).toLocaleString();
    resultBox.classList.remove('hidden');

  } catch (err) {
    errorBox.textContent = `Error: ${err.message}. Make sure the EC2 backend is running and BACKEND_URL is set correctly.`;
    errorBox.classList.remove('hidden');

  } finally {
    btn.disabled = false;
    btn.textContent = 'Call API';
  }
});
  </script>
</body>
</html>
